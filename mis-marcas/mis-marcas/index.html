<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis marcas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#231942">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F2F7;--surface:#fff;--ink:#231942;--muted:#6E6785;--accent:#D6336C;--line:#DDD8E8;--on-accent:#fff;--hh:60px}
@media (prefers-color-scheme:dark){:root{--bg:#15101F;--surface:#201934;--ink:#F1EDF8;--muted:#A79FC0;--accent:#FF6B9A;--line:#352B4D;--on-accent:#15101F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
header a{font:italic 500 26px/1 "Bodoni Moda",Georgia,serif;color:var(--ink);text-decoration:none}
#menu{border:0;background:none;color:var(--ink);padding:8px;margin-right:-8px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:20px 16px 64px}
main.ancho{max-width:none;padding:0}
h1{font:italic 500 32px/1.1 "Bodoni Moda",Georgia,serif;margin:0 0 4px}
h2{font:500 20px/1.2 "Bodoni Moda",Georgia,serif;margin:28px 0 12px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none}
.card .ph{aspect-ratio:4/5;background:var(--line);position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .b{padding:10px 12px 12px}
.card .n{font-weight:700;font-size:14px;margin:0}
.card .t{font-size:13px;color:var(--muted);margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:12px;color:var(--accent);font-weight:500;margin:0 0 2px}
.tag{position:absolute;left:8px;top:8px;background:var(--accent);color:var(--on-accent);font:700 12px "DM Sans",sans-serif;border-radius:999px;padding:2px 9px}
.blog{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.blog a{display:block;padding:12px 16px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.blog a:last-child{border-bottom:0}
.blog b{display:block;font-size:15px}
.blog span{font-size:13px;color:var(--muted)}
.aviso{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px}
.logo{flex:none;width:34px;height:34px;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font:italic 500 18px "Bodoni Moda",serif;color:var(--ink)}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo.g{width:84px;height:84px;border-radius:20px;font-size:40px}
.bar{position:sticky;top:var(--hh);z-index:4;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px;margin-left:auto}
.seg a{padding:5px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
.seg a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.ext{color:var(--ink);padding:4px;display:grid}
iframe{display:block;width:100%;border:0;background:#fff}
.centro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:40px 20px;max-width:420px;margin:0 auto}
.centro p{margin:0;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--on-accent);font:700 16px "DM Sans",sans-serif;border-radius:12px;padding:12px 22px;text-decoration:none}
.enl{color:var(--muted);font-size:14px}
#velo{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#cajon{position:fixed;top:0;right:0;bottom:0;width:min(86vw,340px);background:var(--surface);z-index:10;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
body.abierto #velo{opacity:1;pointer-events:auto}
body.abierto #cajon{transform:none}
#cajon .top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font:italic 500 22px "Bodoni Moda",serif}
#cajon button{border:0;background:none;color:var(--ink);font-size:26px;line-height:1;cursor:pointer;padding:4px 8px}
#cajon nav{overflow-y:auto;padding:4px 0 24px}
#cajon nav a{display:flex;align-items:center;gap:12px;padding:10px 20px;color:var(--ink);text-decoration:none;font:500 17px "DM Sans",sans-serif}
#cajon nav a[aria-current="page"]{color:var(--accent)}
#cajon nav a .badge{margin-left:auto}
#cajon nav h3{margin:14px 20px 2px;font:italic 500 15px "Bodoni Moda",serif;color:var(--muted)}
.badge{background:var(--accent);color:var(--on-accent);font:700 12px "DM Sans",sans-serif;border-radius:999px;padding:2px 9px}
.card{position:relative}
.card>a{display:block;color:inherit;text-decoration:none}
.ph.vacio{display:grid;place-items:center}
.fav{position:absolute;right:8px;top:8px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#6E6785;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.fav[aria-pressed="true"]{color:#D6336C}
header .acc{display:flex;align-items:center;gap:2px}
header a.ico{display:grid;padding:8px;font:inherit;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.chips button{flex:none;font:500 14px "DM Sans",sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
details.add{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 16px}
details.add summary{cursor:pointer;padding:12px 14px;font-weight:500}
details.add form{display:grid;gap:8px;padding:0 14px 14px}
details.add input,details.add select{width:100%;font:16px "DM Sans",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details.add button{border:0;background:var(--accent);color:var(--on-accent);font:700 15px "DM Sans",sans-serif;padding:11px;border-radius:10px;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:18px;width:min(92vw,380px);max-height:80dvh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .lg{display:grid;gap:2px;margin:4px 0 12px;max-height:40dvh;overflow-y:auto}
dialog .lg label{display:flex;align-items:center;gap:10px;padding:8px 2px;font-size:16px}
dialog .lg input{width:20px;height:20px;accent-color:var(--accent)}
dialog .ng{display:flex;gap:8px;margin-bottom:12px}
dialog .ng input{flex:1;min-width:0;font:16px "DM Sans",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
dialog .ng button,dialog .listo{border:0;background:var(--accent);color:var(--on-accent);font:700 14px "DM Sans",sans-serif;border-radius:10px;padding:9px 14px;cursor:pointer}
dialog .listo{width:100%;background:var(--ink);color:var(--bg);padding:11px;font-size:15px}
.org{display:block;width:calc(100% - 24px);margin:0 12px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 10px;font:500 13px "DM Sans",sans-serif;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.etq{font-size:13px;color:var(--muted);margin:12px 0 6px}
.gacc{display:flex;gap:8px;margin:0 0 12px}
.gacc button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;font:500 13px "DM Sans",sans-serif;cursor:pointer}
.chips .nuevog{border-style:dashed;color:var(--muted)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#cajon,#velo{transition:none}}
</style>
</head>
<body>
<header id="cab">
  <a href="#inicio">Mis marcas</a>
  <div class="acc">
  <a class="ico" href="#guardados" aria-label="Guardados"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg></a>
  <button id="menu" aria-label="Abrir índice de marcas" aria-expanded="false" aria-controls="cajon">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 9h20M3 17h20"/></svg>
  </button>
  </div>
</header>
<div id="velo"></div>
<aside id="cajon" aria-label="Índice de marcas" inert>
  <div class="top">Marcas <button id="cerrar" aria-label="Cerrar">×</button></div>
  <nav id="indice"></nav>
</aside>
<dialog id="dlg" aria-label="Grupos"></dialog>
<main id="vista"><p class="sub">Cargando…</p></main>
<script>
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url=u=>/^https?:\/\//i.test(u||"")?u:"#";
const fmt=i=>i?new Date(i).toLocaleDateString("es-ES",{day:"numeric",month:"short"}):"";
const DIAS=14*864e5;
const esNuevo=p=>{const f=p.fecha||p.primeraVez;return f&&Date.now()-new Date(f)<DIAS};
const host=u=>{try{return new URL(u).hostname}catch{return""}};
const letra=n=>n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").charAt(0).toUpperCase();
let D=null;

function img(src){return src?`<img src="${esc(url(src))}" alt="" loading="lazy" referrerpolicy="no-referrer">`:""}
function logo(m,grande){
  const l=letra(m.nombre);
  const src=m.logo||(host(m.web)?`https://www.google.com/s2/favicons?domain=${host(m.web)}&sz=128`:"");
  return `<span class="logo${grande?" g":""}" aria-hidden="true">${src?`<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-h="${esc(host(m.web))}" data-p="${m.logo?0:1}" data-l="${esc(l)}">`:esc(l)}</span>`;
}
// Cadena de respaldo del logo: logo propio -> favicon de Google -> inicial
document.addEventListener("error",e=>{
  const i=e.target;if(!(i instanceof HTMLImageElement)||i.dataset.p===undefined)return;
  if(i.dataset.p==="0"&&i.dataset.h){i.dataset.p="1";i.src=`https://www.google.com/s2/favicons?domain=${i.dataset.h}&sz=128`}
  else{const s=i.closest(".logo");if(s)s.textContent=i.dataset.l||"·"}
},true);

const KG="mis-marcas-guardados-v1";
let G=[],filtroG="todas";
try{const r=JSON.parse(localStorage.getItem(KG));if(Array.isArray(r))G=r}catch{}
const gg=()=>{try{localStorage.setItem(KG,JSON.stringify(G))}catch{}};
const guardado=e=>G.some(x=>x.enlace===e);
const porNombre=(a,b)=>a.nombre.localeCompare(b.nombre,"es",{sensitivity:"base"});
const KR="mis-marcas-grupos-v1";
let GR=[],filtroGr="todos",itemDlg=null;
try{const r=JSON.parse(localStorage.getItem(KR));if(Array.isArray(r))GR=r}catch{}
const grd=()=>{try{localStorage.setItem(KR,JSON.stringify(GR))}catch{}};
const gruposDe=x=>(x.grupos||[]).filter(id=>GR.some(g=>g.id===id));
function crearGrupo(n){
  n=String(n||"").trim().slice(0,40);if(!n)return null;
  let g=GR.find(x=>x.nombre.toLowerCase()===n.toLowerCase());
  if(!g){g={id:Math.random().toString(36).slice(2,9),nombre:n};GR.push(g);grd()}
  return g;
}
function enGrupo(enlace,id,on){
  const it=G.find(x=>x.enlace===enlace);if(!it)return;
  const st=new Set(it.grupos||[]);if(on)st.add(id);else st.delete(id);
  it.grupos=[...st];gg();
}
function renderDlg(){
  const d=document.getElementById("dlg"),it=G.find(x=>x.enlace===itemDlg);
  if(!it){d.close();return}
  const en=new Set(it.grupos||[]);
  d.innerHTML=`<h2 style="margin-top:0">Grupos</h2><p class="sub">${esc(it.titulo)}</p>`+
   (GR.length?`<div class="lg">${GR.map(g=>`<label><input type="checkbox" data-g="${esc(g.id)}" ${en.has(g.id)?"checked":""}> ${esc(g.nombre)}</label>`).join("")}</div>`:`<p class="sub">Aún no tienes grupos. Crea el primero.</p>`)+
   `<div class="ng"><input id="ng" placeholder="Nuevo grupo (por ejemplo, Invierno)" maxlength="40" autocomplete="off" aria-label="Nombre del grupo nuevo"><button type="button" id="cg">Crear y añadir</button></div><button type="button" id="ok" class="listo">Listo</button>`;
}
function abrirGrupos(e){itemDlg=e;renderDlg();const d=document.getElementById("dlg");if(itemDlg&&!d.open)d.showModal()}
function alternar(e){
  if(guardado(e)){G=G.filter(x=>x.enlace!==e)}
  else{for(const m of D.marcas){const p=m.productos.find(x=>x.enlace===e);if(p){G.unshift({enlace:p.enlace,titulo:p.titulo,imagen:p.imagen||"",precio:p.precio||"",marca:m.nombre,slug:m.slug,guardado:Date.now()});break}}}
  gg();pintar(true);
}
function tarjeta(p,m,o={}){
  const f=guardado(p.enlace);
  const ph=p.imagen?img(p.imagen):(m?logo(m,true):"");
  return `<article class="card"><button class="fav" data-e="${esc(p.enlace)}" aria-pressed="${f}" aria-label="${f?"Quitar de guardados":"Guardar artículo"}">${f?"♥":"♡"}</button><a href="${esc(url(p.enlace))}" target="_blank" rel="noopener noreferrer"><div class="ph${p.imagen?"":" vacio"}">${ph}${o.nuevo&&esNuevo(p)?'<span class="tag">Nuevo</span>':""}</div><div class="b">${o.marca?`<p class="m">${esc(p.marca)}</p>`:""}<p class="n">${esc(p.titulo)}</p>${p.precio?`<p class="t">${esc(p.precio)}</p>`:""}</div></a>${o.org?`<button class="org" data-o="${esc(p.enlace)}">${esc(gruposDe(p).map(id=>GR.find(g=>g.id===id).nombre).join(", ")||"Añadir a un grupo")}</button>`:""}</article>`;
}
function guardadosVista(){
  const con=[...new Set(G.map(x=>x.slug))].map(s=>D.marcas.find(m=>m.slug===s)).filter(Boolean).sort(porNombre);
  if(filtroG!=="todas"&&!con.some(m=>m.slug===filtroG))filtroG="todas";
  if(!["todos","sin"].includes(filtroGr)&&!GR.some(g=>g.id===filtroGr))filtroGr="todos";
  const enGr=x=>filtroGr==="todos"||(filtroGr==="sin"?!gruposDe(x).length:gruposDe(x).includes(filtroGr));
  const lista=G.filter(x=>(filtroG==="todas"||x.slug===filtroG)&&enGr(x));
  const cuenta=id=>G.filter(x=>gruposDe(x).includes(id)).length;
  let h=`<h1>Guardados</h1><p class="sub">${G.length} ${G.length===1?"artículo":"artículos"} de todas tus marcas</p>`;
  if(D.marcas.length)h+=`<details class="add"><summary>Añadir un artículo por enlace</summary><form id="formG"><select name="marca" aria-label="Marca">${[...D.marcas].sort(porNombre).map(m=>`<option value="${esc(m.slug)}">${esc(m.nombre)}</option>`).join("")}</select><input name="url" placeholder="Pega el enlace del artículo" inputmode="url" required autocomplete="off"><input name="titulo" placeholder="Nombre (opcional)" autocomplete="off"><button type="submit">Guardar artículo</button></form></details>`;
  h+=`<p class="etq" style="margin-top:0">Grupos</p><div class="chips"><button class="chipg" data-r="todos" aria-pressed="${filtroGr==="todos"}">Todos</button>${GR.map(g=>`<button class="chipg" data-r="${esc(g.id)}" aria-pressed="${filtroGr===g.id}">${esc(g.nombre)} (${cuenta(g.id)})</button>`).join("")}${GR.length?`<button class="chipg" data-r="sin" aria-pressed="${filtroGr==="sin"}">Sin grupo (${G.filter(x=>!gruposDe(x).length).length})</button>`:""}<button class="nuevog">+ Nuevo grupo</button></div>`;
  if(GR.some(g=>g.id===filtroGr))h+=`<div class="gacc"><button id="renG">Renombrar grupo</button><button id="delG">Eliminar grupo</button></div>`;
  if(con.length>1)h+=`<p class="etq">Marcas</p><div class="chips"><button class="chip" data-c="todas" aria-pressed="${filtroG==="todas"}">Todas</button>${con.map(m=>`<button class="chip" data-c="${esc(m.slug)}" aria-pressed="${filtroG===m.slug}">${esc(m.nombre)}</button>`).join("")}</div>`;
  h+=lista.length?`<div class="grid" style="margin-top:10px">${lista.map(p=>tarjeta(p,D.marcas.find(m=>m.slug===p.slug),{marca:true,org:true})).join("")}</div>`:`<div class="aviso">${G.length?"No hay artículos con este filtro.":"Aún no has guardado nada. Toca el corazón de un artículo en la pestaña Novedades de cualquier marca, o añade un enlace con el formulario de arriba."}</div>`;
  return h;
}

function indice(ruta){
  const marcas=[...D.marcas].sort((a,b)=>a.nombre.localeCompare(b.nombre,"es",{sensitivity:"base"}));
  let h=`<a href="#inicio" ${ruta==="inicio"?'aria-current="page"':""}>Inicio · Instagram</a><a href="#guardados" ${ruta==="guardados"?'aria-current="page"':""}>Guardados${G.length?`<span class="badge">${G.length}</span>`:""}</a>`,ult="";
  for(const m of marcas){
    const l=letra(m.nombre);if(l!==ult){h+=`<h3>${esc(l)}</h3>`;ult=l}
    const n=m.productos.filter(esNuevo).length;
    h+=`<a href="#m-${esc(m.slug)}" ${ruta.endsWith("-"+m.slug)?'aria-current="page"':""}>${logo(m)}<span>${esc(m.nombre)}</span>${n?`<span class="badge">${n}</span>`:""}</a>`;
  }
  document.getElementById("indice").innerHTML=h;
}

function inicio(){
  const posts=D.marcas.flatMap(m=>m.publicaciones.map(p=>({...p,marca:m.nombre}))).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  let h=`<h1>Novedades en Instagram</h1><p class="sub">${D.actualizado?"Actualizado el "+new Date(D.actualizado).toLocaleString("es-ES",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}):"Aún sin actualizar"}</p>`;
  if(!posts.length){
    h+=`<div class="aviso">${D.instagramActivo?"Todavía no hay publicaciones. Comprueba que el campo “instagram” de cada marca en marcas.json es correcto.":"Instagram aún no está conectado. Sigue los pasos del archivo LEEME.md para activarlo. Mientras tanto, abre el índice (arriba a la derecha) para entrar en la web de cada marca."}</div>`;
  }else{
    h+=`<div class="grid">`+posts.slice(0,60).map(p=>`<a class="card" href="${esc(url(p.enlace))}" target="_blank" rel="noopener noreferrer"><div class="ph">${img(p.imagen)}</div><div class="b"><p class="m">${esc(fmt(p.fecha))}</p><p class="n">${esc(p.marca)}</p>${p.texto?`<p class="t">${esc(p.texto)}</p>`:""}</div></a>`).join("")+`</div>`;
  }
  return h;
}

function barra(m,tab){
  return `<div class="bar" id="barra">${logo(m)}<span class="nm">${esc(m.nombre)}</span>
  <nav class="seg" aria-label="Secciones de ${esc(m.nombre)}"><a href="#m-${esc(m.slug)}" ${tab==="m"?'aria-current="page"':""}>Tienda</a><a href="#n-${esc(m.slug)}" ${tab==="n"?'aria-current="page"':""}>Novedades</a></nav>
  ${m.web?`<a class="ext" href="${esc(url(m.web))}" target="_blank" rel="noopener noreferrer" aria-label="Abrir ${esc(m.nombre)} en el navegador"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 4H4v12h12v-4M11 3h6v6M17 3l-8 8"/></svg></a>`:""}</div>`;
}

function tienda(m){
  if(!m.web)return `<div class="centro"><p>Esta marca no tiene web guardada. Añádela en marcas.json.</p></div>`;
  if(m.incrustable)return `<iframe id="marco" title="${esc(m.nombre)}" src="${esc(url(m.web))}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
  return `<div class="centro">${logo(m,true)}<h1>${esc(m.nombre)}</h1><p>Esta tienda no permite mostrarse dentro de otra página. Se abre en una ventana aparte; si tienes la app instalada en el móvil, normalmente se abre dentro de ella y vuelves con un toque.</p><a class="btn" href="${esc(url(m.web))}" target="_blank" rel="noopener noreferrer">Abrir ${esc(m.nombre)}</a><a class="enl" href="#n-${esc(m.slug)}">Ver sus novedades</a></div>`;
}

function novedades(m){
  let h=`<div style="padding:20px 16px 64px;max-width:860px;margin:0 auto">`;
  h+=`<h2 style="margin-top:0">Artículos</h2>`;
  h+=m.productos.length?`<div class="grid">`+m.productos.map(p=>tarjeta({...p,marca:m.nombre,slug:m.slug},m,{nuevo:true})).join("")+`</div>`
   :`<div class="aviso">No se han podido leer los artículos de esta tienda. Algunas webs grandes no publican su catálogo. Usa la pestaña Tienda para verla.</div>`;
  if(m.publicaciones.length)h+=`<h2>Instagram</h2><div class="grid">`+m.publicaciones.map(p=>`<a class="card" href="${esc(url(p.enlace))}" target="_blank" rel="noopener noreferrer"><div class="ph">${img(p.imagen)}</div><div class="b"><p class="m">${esc(fmt(p.fecha))}</p>${p.texto?`<p class="t">${esc(p.texto)}</p>`:""}</div></a>`).join("")+`</div>`;
  if(m.articulos.length)h+=`<h2>Novedades del blog</h2><div class="blog">`+m.articulos.slice(0,12).map(a=>`<a href="${esc(url(a.enlace))}" target="_blank" rel="noopener noreferrer"><b>${esc(a.titulo)}</b><span>${esc(fmt(a.fecha))}</span></a>`).join("")+`</div>`;
  return h+`</div>`;
}

function ajustarMarco(){
  const f=document.getElementById("marco");if(!f)return;
  const b=document.getElementById("barra");
  const alto=document.getElementById("cab").offsetHeight+(b?b.offsetHeight:0);
  f.style.height=`calc(100dvh - ${alto}px - env(safe-area-inset-bottom,0px))`;
}

function pintar(sinSalto){
  if(!D)return;
  document.documentElement.style.setProperty("--hh",document.getElementById("cab").offsetHeight+"px");
  const r=(location.hash||"#inicio").slice(1);
  if(r==="guardados"){const v0=document.getElementById("vista");v0.className="";v0.innerHTML=guardadosVista();indice("guardados");cerrar();if(!sinSalto)window.scrollTo(0,0);return}
  const mt=r.match(/^([mn])-(.+)$/);
  const m=mt&&D.marcas.find(x=>x.slug===mt[2]);
  const v=document.getElementById("vista");
  if(m){
    const tab=mt[1];
    v.className=tab==="m"?"ancho":"ancho";
    v.innerHTML=barra(m,tab)+(tab==="m"?tienda(m):novedades(m));
    ajustarMarco();
  }else{v.className="";v.innerHTML=inicio()}
  indice(m?r:"inicio");
  cerrar();
  if(!sinSalto)window.scrollTo(0,0);
}

const menu=document.getElementById("menu"),cajon=document.getElementById("cajon");
function abrir(){document.body.classList.add("abierto");cajon.removeAttribute("inert");menu.setAttribute("aria-expanded","true");document.getElementById("cerrar").focus()}
function cerrar(){document.body.classList.remove("abierto");cajon.setAttribute("inert","");menu.setAttribute("aria-expanded","false")}
menu.addEventListener("click",abrir);
document.getElementById("cerrar").addEventListener("click",()=>{cerrar();menu.focus()});
document.getElementById("velo").addEventListener("click",cerrar);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("abierto")){cerrar();menu.focus()}});
addEventListener("hashchange",()=>pintar());
addEventListener("resize",ajustarMarco);
const vista=document.getElementById("vista");
vista.addEventListener("click",e=>{
  const f=e.target.closest(".fav");if(f){alternar(f.dataset.e);return}
  const c=e.target.closest(".chip");if(c){filtroG=c.dataset.c;pintar(true);return}
  const r=e.target.closest(".chipg");if(r){filtroGr=r.dataset.r;pintar(true);return}
  const o=e.target.closest(".org");if(o){abrirGrupos(o.dataset.o);return}
  if(e.target.closest(".nuevog")){const g=crearGrupo(prompt("Nombre del grupo (por ejemplo, Invierno)"));if(g){filtroGr=g.id;pintar(true)}return}
  if(e.target.id==="renG"){const g=GR.find(x=>x.id===filtroGr);const n=g&&String(prompt("Nuevo nombre del grupo",g.nombre)||"").trim().slice(0,40);if(n){g.nombre=n;grd();pintar(true)}return}
  if(e.target.id==="delG"){const g=GR.find(x=>x.id===filtroGr);if(g&&confirm("¿Eliminar el grupo “"+g.nombre+"”? Los artículos seguirán en Guardados.")){GR=GR.filter(x=>x.id!==g.id);G.forEach(x=>{if(x.grupos)x.grupos=x.grupos.filter(i=>i!==g.id)});grd();gg();filtroGr="todos";pintar(true)}}
});
const dlg=document.getElementById("dlg");
dlg.addEventListener("change",e=>{const c=e.target.closest("input[data-g]");if(c&&itemDlg)enGrupo(itemDlg,c.dataset.g,c.checked)});
const crearDesdeDlg=()=>{const i=document.getElementById("ng");const g=crearGrupo(i&&i.value);if(g&&itemDlg){enGrupo(itemDlg,g.id,true);renderDlg()}};
dlg.addEventListener("click",e=>{if(e.target.id==="cg")crearDesdeDlg();else if(e.target.id==="ok"||e.target===dlg)dlg.close()});
dlg.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ng"){e.preventDefault();crearDesdeDlg()}});
dlg.addEventListener("close",()=>{itemDlg=null;pintar(true)});
vista.addEventListener("submit",e=>{
  if(e.target.id!=="formG")return;e.preventDefault();
  const d=new FormData(e.target);let u=String(d.get("url")).trim();
  if(!/^https?:\/\//i.test(u))u="https://"+u;
  try{new URL(u)}catch{return}
  const m=D.marcas.find(x=>x.slug===d.get("marca"));
  if(m&&!guardado(u)){G.unshift({enlace:u,titulo:String(d.get("titulo")).trim()||host(u)||"Artículo",imagen:"",precio:"",marca:m.nombre,slug:m.slug,guardado:Date.now(),grupos:GR.some(g=>g.id===filtroGr)?[filtroGr]:[]});gg()}
  filtroG="todas";pintar(true);
});

fetch("data/articulos.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{D=d;pintar()}).catch(()=>{document.getElementById("vista").innerHTML='<div class="aviso">No se pudieron cargar los datos.</div>'});
</script>
</body>
</html>
